name: Deploy to VPS

on:
  push:
    branches: [pwrcell-dashboard-security-combo]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package
        run: tar -czf /tmp/deploy.tgz --exclude=.git .

      - name: Set up deploy SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/pwrcell_deploy_key
          chmod 600 ~/.ssh/pwrcell_deploy_key

      - name: Copy bundle to VPS
        run: >
          scp -o StrictHostKeyChecking=accept-new -P 22 -i ~/.ssh/pwrcell_deploy_key
          /tmp/deploy.tgz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy.tgz

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p 22 -i ~/.ssh/pwrcell_deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'REMOTE_EOF'
          set -e
          cd /opt/pwrcell
          # Extract everything except live secrets, data, and user display files.
          tar -xzf /tmp/deploy.tgz \
            --exclude='dashboard.env' \
            --exclude='data' \
            --exclude='display-settings.json' \
            --exclude='display-background.*'
          rm -f /tmp/deploy.tgz
          npm ci --omit=dev --no-audit --no-fund
          # Persistent telemetry history (the old deploy ran PGlite in-memory).
          mkdir -p data/pglite
          touch dashboard.env
          chmod 600 dashboard.env
          grep -q '^PGLITE_DIR=' dashboard.env || echo 'PGLITE_DIR=/opt/pwrcell/data/pglite' >> dashboard.env
          # Serve the UI mockups statically under /mockups/.
          if ! grep -q 'location /mockups/' /etc/nginx/sites-available/pwrcell; then
            sed -i 's|^}$|    location /mockups/ {\n        alias /opt/pwrcell/mockups/;\n    }\n}|' /etc/nginx/sites-available/pwrcell
            nginx -t && systemctl reload nginx
          fi
          systemctl restart pwrcell
          sleep 5
          systemctl is-active --quiet pwrcell
          curl -sf http://127.0.0.1:8080/ -o /dev/null
          echo DEPLOY_OK
          REMOTE_EOF

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/pwrcell_deploy_key
